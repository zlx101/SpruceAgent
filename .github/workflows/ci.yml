name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install --ignore-scripts

      - name: Syntax Check
        run: npm run check

      - name: Doctor
        run: npm run doctor

      - name: Test
        run: npm test

      - name: Alpha Smoke
        run: npm run alpha:smoke
