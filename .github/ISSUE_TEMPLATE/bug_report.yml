name: Bug report
description: Report a reproducible SpruceAgent problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SpruceAgent. Do not include API keys, private workspace data, or `.spruceagent/` runtime state.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Provide the smallest reproducible path.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Local Checks
      description: Paste relevant output from doctor, check, test, or alpha smoke.
      placeholder: |
        npm run doctor
        npm run check
        npm test
        npm run alpha:smoke
  - type: input
    id: node
    attributes:
      label: Node.js Version
      placeholder: "20.19.0"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Windows 11 / macOS / Linux"
  - type: checkboxes
    id: safety
    attributes:
      label: Safety Check
      options:
        - label: I removed secrets, API keys, private workspace data, and local runtime state from this report.
          required: true
